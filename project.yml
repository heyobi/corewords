# XcodeGen spec. CI runs `xcodegen generate` to create Corewords.xcodeproj (not checked in).
name: Corewords
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Corewords:
    type: application
    platform: iOS
    sources:
      - Corewords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.corewords
        PRODUCT_NAME: Corewords
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Corewords/Info.plist
      properties:
        CFBundleDisplayName: Corewords
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: Corewords listens on your device to check how you pronounce a word. Nothing is recorded or sent anywhere.
        NSMicrophoneUsageDescription: The microphone is used only while you hold the Say It button, to check your pronunciation on this device.
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  CorewordsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CorewordsTests
    dependencies:
      - target: Corewords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.corewords.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Corewords.app/Corewords
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Corewords:
    build:
      targets:
        Corewords: all
        CorewordsTests: [test]
    test:
      targets:
        - CorewordsTests
    archive:
      config: Release
